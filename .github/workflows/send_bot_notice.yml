name: Test Telegram Notification

on:
  workflow_dispatch:  # Dòng này giúp hiện nút "Run workflow"

jobs:
  test-notify:        # Thụt vào 2 khoảng trắng
    runs-on: ubuntu-latest
    permissions:      # Thêm dòng này để tránh lỗi quyền
      contents: read
    steps:            # Thụt vào 4 khoảng trắng
      - name: 📱 Test...
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |        # Code bash nằm sau dấu gạch đứng
          set -euo pipefail
          ...